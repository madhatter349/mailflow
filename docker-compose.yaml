# MailFlow — Coolify deployment.
#
# Nothing publishes a host port: Coolify's Traefik terminates TLS and reaches
# the `frontend` service on :80. Postgres and Redis stay on the compose network.
#
# Secrets come from Coolify's env store, never from this file.

services:
  frontend:
    image: ghcr.io/maathimself/mailflow-frontend:4.3.1
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # Traefik terminates TLS; the container serves plain HTTP on :80.
      NGINX_TLS: "off"
    labels:
      # Attach the file-provider headers middleware (HSTS) to the router Coolify
      # generates. The router name embeds this app's uuid and the domain hash;
      # both change only if the app is recreated or the domain moves.
      traefik.http.routers.https-0-csqs2g7zjl68bbnvtjeanclf-frontend-aca3.middlewares: gzip-sse,mailflow-headers@file
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    image: ghcr.io/maathimself/mailflow-backend:4.3.1
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Runs once per deploy (after the backend is healthy, so migrations have run):
  # makes the environment the source of truth for the admin password.
  admin-bootstrap:
    image: ghcr.io/maathimself/mailflow-backend:4.3.1
    restart: "no"
    command: ["node", "/app/bootstrap-admin.mjs"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USER: ${MAILFLOW_ADMIN_USER}
      ADMIN_PASSWORD: ${MAILFLOW_ADMIN_PASSWORD}
      ADMIN_THEME: ${MAILFLOW_ADMIN_THEME:-light}
    configs:
      - source: admin_bootstrap
        target: /app/bootstrap-admin.mjs
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

# The admin bootstrap script is inlined: Coolify deploys the compose content,
# not a working tree, so relative bind mounts would arrive empty.
configs:
  admin_bootstrap:
    content: |
      import pg from 'pg';
      import bcrypt from 'bcryptjs';

      const user = (process.env.ADMIN_USER || '').trim();
      const pass = process.env.ADMIN_PASSWORD || '';
      const theme = (process.env.ADMIN_THEME || '').trim();
      if (!user || !pass) {
        console.log('[bootstrap] ADMIN_USER/ADMIN_PASSWORD unset - nothing to do');
        process.exit(0);
      }

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const client = new pg.Client({
        host: process.env.DB_HOST,
        port: Number(process.env.DB_PORT || 5432),
        database: process.env.DB_NAME,
        user: process.env.DB_USER,
        password: process.env.DB_PASSWORD,
      });
      await client.connect();

      let ready = false;
      for (let i = 0; i < 30 && !ready; i++) {
        try {
          const r = await client.query("select to_regclass('public.users') as t");
          ready = Boolean(r.rows[0]?.t);
        } catch {}
        if (!ready) await sleep(2000);
      }
      if (!ready) {
        console.error('[bootstrap] users table never appeared');
        process.exit(1);
      }

      const hash = await bcrypt.hash(pass, 12);
      const prefs = theme ? JSON.stringify({ theme }) : null;
      const existing = await client.query('select id from users where username = $$1', [user]);
      if (existing.rowCount) {
        await client.query('update users set password_hash = $$2 where username = $$1', [user, hash]);
        if (prefs) {
          await client.query(
            "update users set preferences = coalesce(preferences,'{}'::jsonb) || $$2::jsonb where username = $$1",
            [user, prefs],
          );
        }
        console.log('[bootstrap] password synced from environment for ' + user);
      } else {
        await client.query(
          'insert into users (username, password_hash, is_admin, ai_enabled, preferences) values ($$1,$$2,true,false,$$3::jsonb)',
          [user, hash, prefs || '{}'],
        );
        console.log('[bootstrap] admin created from environment: ' + user);
      }
      await client.end();
